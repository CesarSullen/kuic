<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>

		<meta property="og:title" content="Kuic" />
		<meta property="og:description" content="A privacy-focused kanban-board" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="./assets/opengraph.png" />

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="KUIC" />
		<meta name="theme-color" content="#101010" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>

		<link rel="icon" type="image/png" href="./assets/icons/logo.png" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="./assets/icons/logo.png"
		/>
		<link rel="stylesheet" href="./css/style.css" />

		<link rel="manifest" href="./manifest.json" />

		<title>Kuic Tasks</title>
	</head>
	<body id="body">
		<header class="panel-header">
			<h1 class="panel-title">
				<img src="./assets/icons/logo-no-bg.png" class="panel-logo" />
				KUIC
			</h1>

			<div class="task-stats">
				<div class="task-stat">
					<img
						class="btn-icon"
						src="./assets/icons/clock-countdown-fill.svg"
						alt=""
						srcset=""
					/>
					<span class="tasks-pending">Pending: 0</span>
				</div>
				<div class="task-stat">
					<img
						class="btn-icon"
						src="./assets/icons/check-circle-fill.svg"
						alt=""
						srcset=""
					/>
					<span class="tasks-completed">Completed: 0</span>
				</div>
			</div>
			<button class="btn" id="newColumnBtn">+ New list</button>
		</header>

		<input
			type="file"
			id="fileInput"
			style="display: none"
			accept="application/json"
			onchange="importTasks(event)"
		/>

		<main class="kanban-board"></main>

		<div class="data-buttons">
			<button class="btn data-btn" id="importBtn">
				<img src="./assets/icons/cloud-arrow-down-fill.svg" class="btn-icon" />
				<span id="importBtnText">Import</span>
			</button>
			<button onclick="exportTasks()" class="btn data-btn">
				<img src="./assets/icons/cloud-arrow-up-fill.svg" class="btn-icon" />
				<span id="exportBtnText">Export</span>
			</button>
		</div>
		<footer>
			<div class="footer-content">
				<nav class="footer-links">
					<a href="https://cesarsullen.github.io">About the Developer</a>
					<a href="https://cesarsullen.github.io/views/pwa-install"
						>How to Install?</a
					>
					<a href="https://cesarsullen.github.io/views/donations">Support Me</a>
				</nav>
			</div>
		</footer>
		<script src="js/main.js"></script>
	</body>
</html>
